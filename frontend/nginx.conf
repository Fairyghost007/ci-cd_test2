server {
    # listen on port 80 (note: should be "listen 80;")
    listen 80;

    # match requests starting with /api/
    location /api/{
        # forward them to the node-api backend (should be "proxy_pass http://node-api;")
        proxy_passhttp://node-api;
    }

    # match all other requests
    location /{
        # serve files from this directory (should be "root /usr/share/nginx/html;")
        root/usr/share/nginx/html;
        # default file to serve (should be "index index.html;")
        indexindex.html;
        # try file, then directory, then fall back to index.html for SPA routing (should be "$uri $uri/")
        try_files $uri$uri/ /index.html;
    }

}